name: Supabase keep-alive

on:
  schedule:
    # Ogni 3 giorni alle 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/ka_body.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/ricette?select=id&limit=1")
          # Con la lettura pubblica chiusa è normale un 200 con lista vuota
          if [ "$code" -ge 500 ]; then
            echo "Supabase ha risposto con errore server (HTTP $code)"
            exit 1
          fi
          echo "Keep-alive OK (HTTP $code)"
